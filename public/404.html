<html lang="en-CA">

    <title>Virtus-Strategy</title>

      sessionStorage.setItem(
        "spa-redirect",
        window.location.pathname +
          window.location.search +
          window.location.hash
      );
      window.location.replace("/");
    </script>
  </head>
